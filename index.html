<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="9-CrW-xSiRAZkOMAUV9DH8P65ynVbxT2svGRAaC1Bp4" />
    <meta name="description" content="The best Thaumcraft 4 Research Solver. Find optimal aspect routing paths instantly, or search GTNH's actual research list to auto-fill the grid. Supports GregTech, Blood Magic, Witchery, MagicBees, Forbidden Magic, and 20+ more GTNH addon mods." />
    <meta name="keywords" content="Thaumcraft 4, Thaumcraft Research Solver, GTNH, GregTech New Horizons, Aspect Routing, Thaumcraft Helper, Minecraft Mod, GregTech Aspects, MagicBees Aspects, Blood Magic Aspects" />
    <meta name="author" content="exaltedo2" />
    
    <!-- Open Graph / Discord / Social Media -->
    <meta property="og:title" content="Thaumcraft 4 Research Solver" />
    <meta property="og:description" content="Instantly find the shortest aspect routing paths for your Thaumcraft 4 research notes." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://exaltedo2.github.io/ThaumcraftResearcher/" />
    <meta property="og:image" content="https://exaltedo2.github.io/ThaumcraftResearcher/assets/hero.png" />
    <meta property="og:image:width" content="343" />
    <meta property="og:image:height" content="361" />

    <!-- Twitter Card (Reddit also reads these as fallback) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Thaumcraft 4 Research Solver" />
    <meta name="twitter:description" content="Instantly find the shortest aspect routing paths for your Thaumcraft 4 research notes." />
    <meta name="twitter:image" content="https://exaltedo2.github.io/ThaumcraftResearcher/assets/hero.png" />

    <title data-i18n="app.title">Решатель исследований Thaumcraft 4</title>
    <link rel="icon" type="image/png" href="./assets/hero.png">
    <link rel="stylesheet" href="./src/styles/grid.css">
    <link rel="stylesheet" href="./src/styles/main.css">
  </head>
  <body>
    <div id="app">
      <!-- Left Sidebar: Aspect Library -->
      <aside class="sidebar left-sidebar">
        <h2 data-i18n="aspectLibrary">Библиотека аспектов</h2>
        <div class="setting-group lang-switch">
          <label for="lang-select" data-i18n="lang.label">Язык:</label>
          <select id="lang-select">
            <option value="ru">Русский</option>
            <option value="en">English</option>
          </select>
        </div>

        
        <div class="controls">
          <button id="btn-research" class="primary-btn" data-i18n="btn.research">Исследовать!</button>
          <button id="btn-reset" class="secondary-btn" data-i18n="btn.reset">Сбросить изменения</button>

          <div class="setting-group research-picker">
            <label for="research-search" data-i18n="label.loadResearch">Загрузить исследование GTNH:</label>
            <input type="text" id="research-search" data-i18n-placeholder="placeholder.researchSearch" placeholder="Поиск названия исследования..." autocomplete="off">
            <div class="research-results" id="research-results"></div>
          </div>

          <div class="setting-group">
            <label for="grid-size" data-i18n="label.gridSize">Размер сетки:</label>
            <select id="grid-size">
              <option value="2" data-i18n="grid.small">Малый (3)</option>
              <option value="3" selected data-i18n="grid.standard">Стандартный (4)</option>
              <option value="4" data-i18n="grid.large">Большой (5)</option>
              <option value="5" data-i18n="grid.xl">Очень большой (6)</option>
            </select>
          </div>

          <div class="setting-group mod-toggles">
            <label><input type="checkbox" id="mod-gtnh"> <span data-i18n="mod.gtnh">Аспекты GregTech New Horizons</span></label>
          </div>
        </div>

        <div class="search-container" style="padding-bottom: 10px; border-bottom: 1px solid var(--panel-border); margin-bottom: 10px;">
            <input type="text" id="aspect-search" data-i18n-placeholder="placeholder.aspectSearch" placeholder="Поиск аспектов..." style="width: 100%; padding: 8px;" />
        </div>

        <div class="setting-group compact-toggle">
          <label for="compact-mode"><input type="checkbox" id="compact-mode"> <span data-i18n="label.compactMode">Скрыть подробности аспектов</span></label>
        </div>

        <div class="aspect-list-container" id="aspect-list">
          <!-- Aspects injected by JS -->
        </div>

        <div class="custom-aspect-creator">
          <h3 data-i18n="custom.title">Добавить свой аспект</h3>
          <form id="form-add-aspect">
            <input type="text" id="custom-aspect-name" data-i18n-placeholder="custom.namePlaceholder" placeholder="Название" required />
            <select id="custom-aspect-parent1" required>
              <option value="" disabled selected hidden data-i18n="custom.parent1">Родитель 1</option>
            </select>
            <select id="custom-aspect-parent2" required>
              <option value="" disabled selected hidden data-i18n="custom.parent2">Родитель 2</option>
            </select>
            <button type="submit" data-i18n="custom.add">Добавить</button>
          </form>
        </div>
      </aside>

      <!-- Center Main Content: Grid -->
      <main class="main-content">
        <div class="grid-container" id="grid-container">
          <!-- Hexagons injected by JS -->
        </div>
        <button id="btn-research-2" class="primary-btn grid-reset-btn" data-i18n="btn.research">Исследовать!</button>
        <button id="btn-reset-hexes" class="secondary-btn grid-reset-btn" data-i18n="btn.resetHexes">Очистить соты</button>
      </main>

      <!-- Right Sidebar: How to Use -->
      <div class="right-sidebar-wrapper" id="right-sidebar-wrapper">
        <button id="btn-toggle-sidebar" class="sidebar-toggle-btn" data-i18n-title="sidebar.toggle" title="Показать/скрыть инструкцию">◀</button>
        <aside class="sidebar right-sidebar" id="right-sidebar">
          <h2 data-i18n="howto.title">Как пользоваться</h2>
          <div class="instructions">
            <p data-i18n="howto.1"></p>
            <p data-i18n="howto.2"></p>
            <p data-i18n="howto.3"></p>
            <p data-i18n="howto.4"></p>
            <p data-i18n="howto.5"></p>
            <p data-i18n="howto.6"></p>
            <p data-i18n="howto.7"></p>
            <p data-i18n="howto.8"></p>
          </div>
          <p class="note" data-i18n="howto.note"></p>
        </aside>
      </div>
    </div>
    
    <!-- Modal for editing formulas -->
    <div id="edit-formula-modal" class="modal" style="display: none;">
      <div class="modal-content">
        <h3><span data-i18n="modal.editTitle">Изменить</span> <span id="edit-formula-aspect-name"></span></h3>
        <div class="setting-group" style="margin: 15px 0;">
            <select id="edit-formula-parent1"></select>
            <select id="edit-formula-parent2"></select>
        </div>
        <div style="display: flex; gap: 10px; justify-content: flex-end;">
            <button id="cancel-formula-btn" style="padding: 5px 10px; background: rgba(0,0,0,0.3); color: white; border: 1px solid rgba(255,255,255,0.1); cursor: pointer;" data-i18n="btn.cancel">Отмена</button>
            <button id="save-formula-btn" style="padding: 5px 10px; background: var(--primary-color); color: white; border: none; cursor: pointer;" data-i18n="btn.save">Сохранить</button>
        </div>
      </div>
    </div>
    
    <!-- Custom Tooltip -->
    <div id="aspect-tooltip" class="aspect-tooltip" style="display: none;"></div>

    <!-- Scripts -->
    <script type="module" src="./src/main.js"></script>

    <!-- Cloudflare Web Analytics -->
    <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "e4a5cff768ed4db598da24a3171d46a8"}'></script>
    <!-- End Cloudflare Web Analytics -->
  </body>
</html>
